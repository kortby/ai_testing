[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kortby@gmail.com", email = "kortby@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.162.0",
    "gensim>=4.4.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "tensorflow>=2.21.0",
    "textblob>=0.20.1",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
